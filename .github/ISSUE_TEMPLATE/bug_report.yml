name: "🐛 Bug report"
description: Report a reproducible bug or regression
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill this out!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the bug.
      placeholder: "sanitize drops 0 from payload"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be as specific as possible.
      placeholder: |
        1. Call sanitize({...})
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Payload keeps 0 values"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "0 values are removed"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Runtime, framework, bundler, OS, etc.
      placeholder: "Node 20, Vite 6, macOS 15"
  - type: textarea
    id: extra
    attributes:
      label: Additional context
